name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # Next.js generates the PageProps and LayoutProps types the pages use.
      - name: Generate route types
        run: npx next typegen

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test
